services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tapcetdb}
      POSTGRES_USER: ${POSTGRES_USER:-tapcetuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tapcetpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tapcetuser}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-tapcetuser}:${POSTGRES_PASSWORD:-tapcetpass}@db:5432/${POSTGRES_DB:-tapcetdb}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      NODE_ENV: production
      NEXT_OUTPUT: standalone
      # API calls from browser go through nginx, so no server-side rewrite needed in prod
    depends_on:
      - server
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    restart: unless-stopped

volumes:
  postgres_data:
